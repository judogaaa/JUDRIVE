name: Verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt -r tests/requirements-dev.txt
      - name: Check release tree for private artifacts
        run: |
          if git ls-files | rg -i '(^|/)\.env($|\.(local|prod|production|development)$)|\.(pdf|sqlite3?|db|pem|key|bak|bundle)([.-]|$)|^(local-data|materials|data/index|vendor/neurodvs_mock/data)/|^e2e/storage-state\.json$'; then
            exit 1
          fi
      - run: python -m pytest -q
      - run: python scripts/verify_submission_regressions.py --synthetic-pdfs
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run lint -- --deny-warnings
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -r tests/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: bash scripts/verify_compose.sh
