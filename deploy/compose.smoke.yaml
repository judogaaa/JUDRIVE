services:
  backend:
    env_file: !reset []
    command: ["sh", "-c", "python /audit/fake_gigachat.py & exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8090"]
    environment:
      COOKIE_SECURE: "false"
      DEMO_FLEET_SHA256: ${TEST_DEMO_FLEET_SHA256:?Generated by verify_compose.sh}
      CHIEF_USERNAME: compose-test
      CHIEF_PASSWORD_HASH: ${TEST_CHIEF_HASH:?Generated by verify_compose.sh}
      SESSION_SECRET: ${TEST_SESSION_SECRET:?Generated by verify_compose.sh}
      GIGACHAT_CREDENTIALS: e2e-test-authorization-key
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_AUTH_URL: http://127.0.0.1:8004/api/v2/oauth
      GIGACHAT_BASE_URL: http://127.0.0.1:8004
      GIGACHAT_MODEL: e2e-function-stub
      NO_PROXY: ml,toir,127.0.0.1
      no_proxy: ml,toir,127.0.0.1
    volumes:
      - ${JUDRIVE_SMOKE_STUB:?Generated by verify_compose.sh}:/audit/fake_gigachat.py:ro
  web:
    environment:
      NO_PROXY: backend,127.0.0.1
      no_proxy: backend,127.0.0.1
    ports: !override ["127.0.0.1:${JUDRIVE_SMOKE_PORT:-18184}:80"]
