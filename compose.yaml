x-runtime: &runtime
  image: ${JUDRIVE_RUNTIME_IMAGE:-judrive-runtime:local}
  build:
    context: .
    dockerfile: deploy/Dockerfile.backend
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: &rotated_logs
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  ml:
    <<: *runtime
    command: ["python", "-m", "uvicorn", "mock_ml.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      MOCK_DATA_PATH: /run/judrive-fixtures/vehicles.json
    volumes:
      - ${JUDRIVE_FLEET_DIR:-./local-data/external}:/run/judrive-fixtures:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  toir:
    <<: *runtime
    command: ["python", "-m", "uvicorn", "mock_toir.app:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      MOCK_DATA_PATH: /run/judrive-fixtures/vehicles.json
    volumes:
      - ${JUDRIVE_FLEET_DIR:-./local-data/external}:/run/judrive-fixtures:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  backend:
    <<: *runtime
    env_file:
      - path: .env
        required: false
    environment:
      MOCK_ML_URL: http://ml:8001
      MOCK_TOIR_URL: http://toir:8002
      FLEET_DATA_PATH: /run/judrive-fixtures/vehicles.json
      PDF_DIR: /app/materials/manuals
      DB_PATH: /app/local-data/judrive.sqlite
      COOKIE_SECURE: "true"
    depends_on:
      ml:
        condition: service_healthy
      toir:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/live', timeout=5).close()"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 180s
    volumes:
      - ${JUDRIVE_FLEET_DIR:-./local-data/external}:/run/judrive-fixtures:ro
      - ${JUDRIVE_MANUALS_DIR:-./materials/manuals}:/app/materials/manuals:ro
      - ${JUDRIVE_STATE_DIR:-./local-data}:/app/local-data
      - ${JUDRIVE_CA_DIR:-./local-data/ca}:/run/judrive-ca:ro
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    logging: *rotated_logs
    depends_on:
      backend:
        condition: service_healthy
    environment:
      JUDRIVE_DOMAIN: ${JUDRIVE_DOMAIN:?Set JUDRIVE_DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - tls_data:/data
      - tls_config:/config
volumes:
  tls_data:
  tls_config:
